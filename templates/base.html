<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Cleaning Check-In{% endblock %}</title>
<style>
  body { font-family: -apple-system, Segoe UI, Roboto, sans-serif; background:#f6f7fb; margin:0; padding:24px 16px; color:#222; }
  .card { max-width:420px; margin:0 auto; background:#fff; border-radius:12px; padding:24px; box-shadow:0 1px 4px rgba(0,0,0,0.08); }
  h1 { font-size:20px; margin:0 0 4px; }
  .sub { color:#666; font-size:14px; margin-bottom:20px; }
  .worker-btn { display:block; width:100%; padding:14px; margin-bottom:10px; font-size:16px; border-radius:8px; border:1px solid #ddd; background:#fafafa; cursor:pointer; text-align:left; }
  .worker-btn:hover { background:#eef1ff; border-color:#6161ff; }
  .status-ok { color:#00a35c; font-weight:600; }
  .status-none { color:#c0392b; font-weight:600; }
  .status-multi { color:#b8860b; font-weight:600; }
  .field { margin-bottom:14px; }
  label { display:block; font-size:13px; color:#666; margin-bottom:4px; }
  select, input[type=time] { width:100%; padding:8px; border-radius:6px; border:1px solid #ddd; }
  .task-row { border:1px solid #eee; border-radius:8px; padding:10px; margin-bottom:8px; }
  .footnote { font-size:12px; color:#999; margin-top:20px; }
</style>
</head>
<body>
<div class="card">
{% block content %}{% endblock %}
</div>
</body>
</html>
